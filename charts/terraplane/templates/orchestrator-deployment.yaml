{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraplane.fullname" . }}-orchestrator
  namespace: {{ include "terraplane.namespace" . }}
  labels:
    {{- include "terraplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "terraplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      {{- if .Values.orchestrator.config }}
      annotations:
        checksum/orchestrator-config: {{ toYaml .Values.orchestrator.config | sha256sum }}
      {{- end }}
      labels:
        {{- include "terraplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "terraplane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["orchestrator"]
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.service.port }}
              protocol: TCP
          env:
            - name: ORCHESTRATOR_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: ORCHESTRATOR_LISTEN_PORT
              value: {{ .Values.orchestrator.service.port | quote }}
            {{- if .Values.orchestrator.config }}
            - name: ORCHESTRATOR_CONFIG_PATH
              value: /etc/terraplane/config/orchestrator.yaml
            {{- end }}
            {{- range $key, $value := .Values.orchestrator.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.orchestrator.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.orchestrator.config .Values.orchestrator.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.orchestrator.config }}
            - name: orchestrator-config
              mountPath: /etc/terraplane/config
              readOnly: true
            {{- end }}
            {{- with .Values.orchestrator.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.orchestrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.orchestrator.migrate.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "terraplane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "migrate"]
          env:
            {{- range $key, $value := .Values.orchestrator.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.orchestrator.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.orchestrator.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- if or .Values.orchestrator.config .Values.orchestrator.extraVolumes }}
      volumes:
        {{- if .Values.orchestrator.config }}
        - name: orchestrator-config
          configMap:
            name: {{ include "terraplane.fullname" . }}-orchestrator-config
        {{- end }}
        {{- with .Values.orchestrator.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
