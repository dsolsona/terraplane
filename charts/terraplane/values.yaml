# Default values for terraplane.
# This is a YAML-formatted file.

# -- Override the release namespace. Set to "" to use `helm -n` / Release.Namespace only.
namespaceOverride: ""

image:
  # -- Container image repository
  repository: ghcr.io/terraplane-org/terraplane
  # -- Image tag (defaults to Chart.AppVersion when empty)
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Optional image pull secrets
imagePullSecrets: []

# -- Extra labels applied to all resources
commonLabels: {}

orchestrator:
  # -- Deploy the orchestrator. Set false for an agents-only release (typical: public orch, private agents).
  enabled: true
  # -- Number of orchestrator replicas
  replicaCount: 1
  migrate:
    # -- Run `terraplane db migrate` as an initContainer before the orchestrator starts
    enabled: true
  # -- Existing ServiceAccount name (chart does not create it)
  serviceAccountName: ""
  # -- Extra environment variables for the orchestrator (non-secret config)
  # Example: LOG_LEVEL: info
  env: {}
  # -- Load env from existing ConfigMaps/Secrets (chart does not create secrets)
  # Example:
  # - secretRef:
  #     name: terraplane-orchestrator
  envFrom: []
  # -- Extra PodSpec volumes (pass-through). Chart does not interpret volume types.
  extraVolumes: []
  # -- Extra volumeMounts on the orchestrator container (pass-through)
  extraVolumeMounts: []
  # -- Orchestrator config for multi-team mode (agents, repos, permissions, apply gates).
  # Rendered to a ConfigMap, mounted at /etc/terraplane/config/orchestrator.yaml, and
  # ORCHESTRATOR_CONFIG_PATH is set. Empty keeps the single-team behaviour. See docs/multi-team.md.
  config: {}
  # -- Pod resources
  resources: {}
  service:
    # -- Kubernetes Service type
    type: ClusterIP
    # -- Service / container port
    port: 8080
  ingress:
    # -- Enable Ingress for the orchestrator (webhook + health)
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    # Example:
    # - host: terraplane.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    hosts: []
    # -- Ingress TLS
    tls: []

agentDefaults:
  # -- Shared env for all agents (merged under per-agent env)
  env: {}
  # -- Shared envFrom for all agents (concatenated with per-agent envFrom)
  envFrom: []
  # -- HTTP(S) base URL agents use to reach the orchestrator (required when agents is non-empty). Example: https://terraplane.example.com
  orchestratorURL: ""
  # -- Existing ServiceAccount name for agent pods (chart does not create it)
  serviceAccountName: ""
  # -- Extra PodSpec volumes for all agents (concatenated with agents[].extraVolumes). Pass-through; chart does not interpret volume types.
  extraVolumes: []
  # -- Extra volumeMounts for all agents (concatenated with agents[].extraVolumeMounts). Applied after work/ssh mounts.
  extraVolumeMounts: []
  # -- Agent working directory (workspace + terraform bins)
  workDir: /var/terraplane/work
  # -- Default pod resources for agents
  resources: {}
  # -- How agents authenticate to clone: `ssh` with the deploy key in sshKey, or `app` with per-job tokens minted by the orchestrator (orchestrator must be a GitHub App; no sshKey needed)
  scmAuth: ssh
  sshKey:
    # -- Existing Secret name containing the deploy key (required for private repos when scmAuth is `ssh`)
    secretName: ""
    # -- Key within the Secret
    secretKey: ssh-private-key
    # -- Absolute path where the key is mounted in the container
    mountPath: /etc/terraplane/git_ssh_key
  persistence:
    # -- Create a PVC per agent for plan/apply workspace reuse. false uses emptyDir
    enabled: true
    # -- PVC size
    size: 20Gi
    # -- StorageClass name (empty = cluster default)
    storageClassName: ""
    # -- PVC access mode
    accessMode: ReadWriteOnce

# -- Agent definitions. Each entry becomes a Deployment (replicas=1) with AGENT_ID = name.
# Typically installed as a separate release from the orchestrator (private network / cluster).
# Example:
# - name: agent-dev
#   env: {}
#   envFrom: []
#   serviceAccountName: terraplane-agent
#   extraVolumes: []
#   extraVolumeMounts: []
#   scmAuth: ssh
#   sshKey:
#     secretName: agent-dev-ssh
#   persistence:
#     size: 50Gi
agents: []
